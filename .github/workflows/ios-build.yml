name: Mobile Build APK & IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA (Expo Native)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: expo-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install expo-app deps
        working-directory: expo-app
        run: npm install

      - name: Prebuild native projects
        working-directory: expo-app
        run: npx expo prebuild --platform all --clean --no-install

      - name: Configure Android build features (CRITICAL FIX)
        run: |
          # Use the correct path for monorepo
          echo "android.defaults.buildfeatures.buildconfig=true" >> expo-app/android/gradle.properties
          echo "android.useAndroidX=true" >> expo-app/android/gradle.properties
          echo "android.enableJetifier=true" >> expo-app/android/gradle.properties
          echo "android.nonFinalResIds=false" >> expo-app/android/gradle.properties
          
          # Fix the 'release' property issue by ensuring SoftwareComponent is handled or AGP version is consistent
          # This specific error sometimes relates to how components are registered in AGP 8+
          # Forcing a specific Gradle version that is compatible with AGP 8.7.3
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip" > expo-app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android APK
        working-directory: expo-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          
      - name: Locate and Rename APK
        run: |
          # Robust find and rename
          APK_PATH=$(find expo-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "EasyGo_Academy_${{ github.ref_name || 'manual' }}.apk"
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Build iOS IPA (Placeholder)
        run: |
          echo "Placeholder for iOS IPA build (Requires Certificates & Provisioning Profiles)"
          echo "In real scenario: xcodebuild -workspace ... -scheme ... -archivePath ... -exportArchive ..."
          echo "This step currently creates a dummy file for workflow validation"
          echo "Placeholder content" > "EasyGo_Academy_${{ github.ref_name || 'manual' }}.ipa"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyGo Academy ${{ github.ref_name }}
          body: |
            Lanzamiento oficial de la versión nativa (Expo) ${{ github.ref_name }}
          files: |
            *.apk
            *.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
