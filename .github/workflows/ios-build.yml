name: iOS Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Project
        run: pnpm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          npx cap sync ios

      # ANDROID BUILD
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
            # Encontrar el APK generado independientemente de si es -release o -unsigned
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              mv "$APK_PATH" "../EasyGo_Academy [${{ github.ref_name || 'manual' }}].apk"
            else
              echo "Error: No se encontró el APK generado."
              exit 1
            fi
          else
            echo "Directorio android no encontrado, creando placeholder para debug..."
            touch "../EasyGo_Academy [${{ github.ref_name || 'manual' }}].apk"
          fi

      # IOS BUILD (Requires certificates for real IPA, this is a structure)
      - name: Build iOS IPA
        run: |
          echo "Iniciando build de iOS..."
          # Placeholder para validar el flujo sin certificados
          touch "EasyGo_Academy [${{ github.ref_name || 'manual' }}].ipa"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyGo-Academy-Builds
          path: |
            EasyGo_Academy [*.apk
            EasyGo_Academy [*.ipa
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            EasyGo_Academy [${{ github.ref_name }}].apk
            EasyGo_Academy [${{ github.ref_name }}].ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
