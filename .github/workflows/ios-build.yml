name: iOS Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA (Expo Native)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install expo-app deps
        working-directory: expo-app
        run: npm install

      - name: Prebuild native projects
        working-directory: expo-app
        run: npx expo prebuild --platform all --clean --no-install

      # ANDROID BUILD
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        working-directory: expo-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "../../EasyGo_Academy [${{ github.ref_name || 'manual' }}].apk"

      # IOS BUILD (Placeholder until certificates are added)
      - name: Build iOS IPA
        run: |
          echo "Iniciando build de iOS nativo..."
          echo "Placeholder for iOS IPA build (Requires Certificates)" > "EasyGo_Academy [${{ github.ref_name || 'manual' }}].ipa"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyGo Academy ${{ github.ref_name }}
          body: |
            Lanzamiento oficial de la versión nativa (Expo) ${{ github.ref_name }}
          files: |
            *.apk
            *.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
