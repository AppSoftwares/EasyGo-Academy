name: Build and Release Mobile

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK and IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Project
        run: pnpm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          npx cap sync ios

      # ANDROID BUILD
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "../EasyGo_Academy [${{ github.ref_name }}].apk"

      # IOS BUILD (Requires certificates for real IPA, this is a structure)
      - name: Build iOS IPA
        run: |
          echo "Iniciando build de iOS..."
          # Aquí irían los comandos de xcodebuild si hubiera certificados configurados
          # Por ahora generamos un placeholder para validar el flujo
          touch "EasyGo_Academy [${{ github.ref_name }}].ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            EasyGo_Academy [${{ github.ref_name }}].apk
            EasyGo_Academy [${{ github.ref_name }}].ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
