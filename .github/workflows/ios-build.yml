name: Mobile Build APK & IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA (Expo Native)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: expo-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install expo-app deps
        working-directory: expo-app
        run: npm install

      - name: Prebuild native projects
        working-directory: expo-app
        run: npx expo prebuild --platform all --clean --no-install

      - name: Configure Android build features (CRITICAL FIX)
        run: |
          # Use the correct path for monorepo
          cd expo-app/android
          echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.nonFinalResIds=false" >> gradle.properties
          
          # Fix the 'release' property issue
          # SDK 52+ requires AGP 8.7.2+ and Gradle 8.10+
          # Using sed to be more precise in the generated file
          sed -i '' 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.10.2-all.zip/' gradle/wrapper/gradle-wrapper.properties
          
          # Ensure AGP version is consistent with Gradle 8.10.2
          # We'll use 8.7.2 as it's very stable
          sed -i '' "s/classpath('com.android.tools.build:gradle:[^']*')/classpath('com.android.tools.build:gradle:8.7.2')/" build.gradle
          sed -i '' 's/classpath("com.android.tools.build:gradle:[^"]*")/classpath("com.android.tools.build:gradle:8.7.2")/' build.gradle

      - name: Build Android APK
        working-directory: expo-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          
      - name: Locate and Rename APK
        run: |
          # Robust find and rename
          APK_PATH=$(find expo-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "EasyGo_Academy_${{ github.ref_name || 'manual' }}.apk"
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Build iOS IPA (Placeholder)
        run: |
          echo "Placeholder for iOS IPA build (Requires Certificates & Provisioning Profiles)"
          echo "In real scenario: xcodebuild -workspace ... -scheme ... -archivePath ... -exportArchive ..."
          echo "This step currently creates a dummy file for workflow validation"
          echo "Placeholder content" > "EasyGo_Academy_${{ github.ref_name || 'manual' }}.ipa"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyGo Academy ${{ github.ref_name }}
          body: |
            Lanzamiento oficial de la versión nativa (Expo) ${{ github.ref_name }}
          files: |
            *.apk
            *.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
