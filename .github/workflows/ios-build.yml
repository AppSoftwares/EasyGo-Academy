name: iOS Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Project
        run: pnpm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          npx cap sync ios

      # ANDROID BUILD
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
            mv app/build/outputs/apk/release/app-release.apk "../EasyGo_Academy [${{ github.ref_name || 'manual' }}].apk"
          else
            echo "Directorio android no encontrado, saltando build..."
            touch "EasyGo_Academy [${{ github.ref_name || 'manual' }}].apk"
          fi

      # IOS BUILD (Requires certificates for real IPA, this is a structure)
      - name: Build iOS IPA
        run: |
          echo "Iniciando build de iOS..."
          # Placeholder para validar el flujo sin certificados
          touch "EasyGo_Academy [${{ github.ref_name || 'manual' }}].ipa"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            EasyGo_Academy [${{ github.ref_name }}].apk
            EasyGo_Academy [${{ github.ref_name }}].ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
