name: iOS & Android Build

on:
  workflow_dispatch: # Disparador manual para ahorrar minutos
    inputs:
      build_id:
        description: 'Nombre del archivo final'
        required: true
        default: 'EasyGoAcademy'

jobs:
  build:
    runs-on: macos-14 # El runner más rápido para ambos sistemas
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Install dependencies
        run: |
          pnpm config set supported-architectures '{"os":["win32","darwin","linux"],"cpu":["x64","arm64"]}'
          pnpm install --frozen-lockfile || pnpm install

      - name: Build Web Project
        run: pnpm run build

      - name: Generate Assets
        run: |
          pnpm exec capacitor-assets generate --iconBackgroundColor '#0a041e' --iconBackgroundColorDark '#0a041e'
          find android/app/src/main/res -name "*.webp" -delete || true

      - name: Capacitor Sync
        run: npx cap sync

      # --- CONSTRUCCIÓN ANDROID ---
      - name: Build Android App (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Android Artifact
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "${{ github.event.inputs.build_id }} v$VERSION.apk"

      # --- CONSTRUCCIÓN iOS (SIN FIRMA - GRATIS) ---
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                    -scheme App \
                    -configuration Debug \
                    -destination 'generic/platform=iOS' \
                    -sdk iphoneos \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    ENABLE_USER_SCRIPT_SANDBOXING=NO \
                    build

      - name: Create IPA for Sideloadly
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq "${{ github.event.inputs.build_id }} v$VERSION.ipa" Payload

      # --- PUBLICACIÓN EN RELEASES ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: "Release v${{ steps.package-version.outputs.version }}"
          files: |
            *.apk
            *.ipa
          body: |
            Compilación automática generada con éxito.
            Versión: ${{ steps.package-version.outputs.version }}
            Plataformas: Android (APK) e iOS (IPA Sideload).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
