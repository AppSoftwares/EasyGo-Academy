name: iOS Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA (Expo Native)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install expo-app deps
        working-directory: expo-app
        run: |
          npm install

      - name: Prebuild native projects
        working-directory: expo-app
        run: |
          npx expo prebuild --platform all --clean --no-install

      - name: Force correct Gradle/AGP versions
        working-directory: expo-app
        run: |
          # Ensure android directory exists
          if [ -d "android" ]; then
            # Fix distributionUrl in gradle-wrapper.properties to 8.14.3 (required for SDK 52+)
            sed -i.bak 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
            
            # Fix AGP version in build.gradle to 8.7.3 (required for SDK 52+)
            sed -i.bak "s#classpath('com.android.tools.build:gradle:[^']*')#classpath('com.android.tools.build:gradle:8.7.3')#" android/build.gradle
            sed -i.bak 's#classpath("com.android.tools.build:gradle:[^"]*")#classpath("com.android.tools.build:gradle:8.7.3")#' android/build.gradle
            
            # Inject critical rules into gradle.properties
            echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
            echo "android.defaults.buildfeatures.resvalues=true" >> android/gradle.properties
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

      # ANDROID BUILD
      - name: Build Android APK
        working-directory: expo-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          # Find the APK and copy it to the root
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "../../EasyGo_Academy [${{ github.ref_name || 'manual' }}].apk" \;

      # IOS BUILD (Requires certificates for real IPA, this is a structure)
      - name: Build iOS IPA
        run: |
          echo "Iniciando build de iOS nativo..."
          # Placeholder para validar el flujo sin certificados
          echo "Placeholder for iOS IPA build (Requires Certificates)" > "EasyGo_Academy [${{ github.ref_name || 'manual' }}].ipa"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyGo Academy ${{ github.ref_name }}
          body: |
            Lanzamiento oficial de la versión nativa (Expo) ${{ github.ref_name }}
          files: |
            *.apk
            *.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
