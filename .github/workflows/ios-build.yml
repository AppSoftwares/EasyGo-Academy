name: Build APK and IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Nombre del archivo base'
        required: true
        default: 'EasyGoAcademy'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Install dependencies
        run: |
          pnpm config set supported-architectures '{"os":["win32","darwin","linux"],"cpu":["x64","arm64"]}'
          pnpm install --frozen-lockfile || pnpm install
          # Sharp is now in onlyBuiltDependencies, so its build script will run.

      - name: Create .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Web Project
        run: pnpm run build

      - name: Generate Assets
        run: |
          pnpm exec capacitor-assets generate --iconBackgroundColor '#0a041e' --iconBackgroundColorDark '#0a041e'
          find android/app/src/main/res -name "*.webp" -delete || true
          rm -rf ios/App/CapApp-SPM

      - name: Capacitor Sync
        run: pnpm exec cap sync

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install

      - name: Neutralizar Check Pods Manifest.lock
        run: |
          cd ios/App
          ruby -e "require 'xcodeproj'; project = Xcodeproj::Project.open('App.xcodeproj'); project.targets.each { |t| t.shell_script_build_phases.each { |p| p.shell_script = 'echo \"Bypassing sync check in CI\"' if p.name.include?('Check Pods Manifest.lock') } }; project.save"
          cp Podfile.lock Manifest.lock || true
          mkdir -p Pods && cp Podfile.lock Pods/Manifest.lock || true

      - name: Build Android App (Release)
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache -Pandroid.defaults.buildfeatures.buildconfig=true

      - name: Prepare Android Artifact
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "EasyGoAcademy $VERSION.apk"

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -workspace App.xcworkspace -scheme App || true
          xcodebuild -workspace App.xcworkspace \
                    -scheme App \
                    -configuration Debug \
                    -destination 'generic/platform=iOS' \
                    -sdk iphoneos \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    ENABLE_USER_SCRIPT_SANDBOXING=NO \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    ONLY_ACTIVE_ARCH=NO \
                    build

      - name: Create IPA for Sideloadly
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se encontró el binario .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq "EasyGoAcademy $VERSION.ipa" Payload

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: "EasyGo Academy v${{ steps.package-version.outputs.version }}"
          files: |
            EasyGoAcademy ${{ steps.package-version.outputs.version }}.ipa
            EasyGoAcademy ${{ steps.package-version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
