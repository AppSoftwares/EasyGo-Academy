name: Web Build

on:
  push:
    branches: [ feat/integration-examples ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: easygo-academy
      run: npm ci

    - name: Run web build
      working-directory: easygo-academy
      run: npm run build

    - name: Upload web dist
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: easygo-academy/dist
